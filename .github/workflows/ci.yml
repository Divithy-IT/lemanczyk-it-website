name: Website CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and validate website
        run: npm test
      - name: Validate deployment plan
        run: |
          bash -n deploy/bin/website-deploy
          python3 tests/deploy_plan_test.py
          python3 -m unittest discover -s tests -p 'test_transfer.py' -v
          node --check transfer/app.js
          node --check transfer/player.js
      - name: Install browser for responsive tests
        run: npx playwright install --with-deps chromium
      - name: Run responsive browser tests
        run: npm run test:ui
      - name: Verify private transfer in a real browser
        run: node tests/transfer_browser.mjs
      - name: Verify prerendered pages and production hydration
        run: npm run test:production
      - name: Check for common secret patterns
        run: |
          if git grep -nEI '(ghp_|github_pat_|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- ':!package-lock.json' ':!.github/workflows/ci.yml'; then
            echo "Potential secret detected"
            exit 1
          fi
      - name: Ensure clean generated diff
        run: git diff --check

name: Website CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and validate website
        run: npm test
      - name: Check for common secret patterns
        run: |
          if git grep -nEI '(ghp_|github_pat_|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- ':!package-lock.json'; then
            echo "Potential secret detected"
            exit 1
          fi
      - name: Ensure clean generated diff
        run: git diff --check
